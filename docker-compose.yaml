services:
  database:
    image: mariadb:11
    container_name: minerva_database
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minerva_db
      MARIADB_USER: minerva
      MARIADB_PASSWORD: minerva
    ports:
      - "3306:3306"
    volumes:
      - mariadb_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    container_name: minerva_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_volume:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - "ollama serve & until ollama list > /dev/null 2>&1; do sleep 1; done && ollama pull ${OLLAMA_MODEL:-llama3.2:3b} && wait"

  backend:
    build: ./backend
    container_name: minerva_backend
    restart: unless-stopped
    shm_size: '1g'
    init: true
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: minerva
      DB_PASSWORD: minerva
      DB_NAME: minerva_db
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      GS_DATA_DIR: /app/gs_data
    ports:
      - "8003:8003"
    volumes:
      - ./gs_data:/app/gs_data:ro
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: minerva_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8003
    ports:
      - "8004:8004"
    depends_on:
      - backend

volumes:
  mariadb_volume:
  ollama_volume:
